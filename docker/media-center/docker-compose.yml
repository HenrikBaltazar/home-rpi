networks:
  internal_net:
    driver: bridge
  cloudflared_net:
    external: true

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    networks:
      - cloudflared_net
  
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - STAGING=true
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - URL=${LAB_URL}
      - SUBDOMAINS=${LAB_SUBDOMAINS}
      - ONLY_SUBDOMAINS=true
      - VALIDATION=${VALIDATION}
      - DNSPLUGIN=${DNSPLUGIN}
    volumes:
      - /srv/swag:/config
    networks:
      - cloudflared_net
    #ports:
     # - 80:80
     # - 443:443
    restart: unless-stopped
  
  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /srv/heimdall:/config
    networks:
      - cloudflared_net
    restart: unless-stopped
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    networks:
      - cloudflared_net
    ports:
      - "8082:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /srv/media/downloads:/downloads
      - /srv/qbittorrent/config:/config
    restart: unless-stopped
    
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - cloudflared_net
      - internal_net
    ports:
      - "8083:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /srv/prowlarr/config:/config
    restart: unless-stopped
  
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    networks:
      - internal_net
    #ports:
      #- 8191:8191
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    networks:
      - cloudflared_net
    ports:
      - "8084:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /srv/radarr/config:/config
      - /srv/media/downloads:/downloads
      - /srv/media/center/Filmes:/movies
      - /srv/nfty-arr-script:/config/custom_scripts
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - cloudflared_net
    ports:
      - "8085:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /srv/sonarr/config:/config
      - /srv/media/downloads:/downloads
      - /srv/media/center/Series:/tv
      - /srv/nfty-arr-script:/config/custom_scripts
    restart: unless-stopped

  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    networks:
      - cloudflared_net
    ports:
      - "8086:6767"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /srv/bazarr/config:/config
      - /srv/media/center/Filmes:/movies
      - /srv/media/center/Series:/tv
    restart: unless-stopped

  dash-dot:
    image:   mauricenino/dashdot:latest
    container_name: dash-dot
    networks:
      - cloudflared_net
    ports:
      - 8088:3001
    environment:
      - TZ=America/Sao_Paulo
      #- DASHDOT_ROUTING_PATH=${DASHDOT_WIDGET_URL}
    volumes:
      - /:/mnt/host:ro
    privileged: true
    restart: unless-stopped
  
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    networks:
      - cloudflared_net
    ports:
      - 8096:8096
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_URL}
    volumes:
      - /srv/jellyfin/config:/config
      - /srv/media/center/Series:/data/tvshows
      - /srv/media/center/Filmes:/data/movies
    restart: unless-stopped

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    ports:
      - "8081:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    networks:
      - cloudflared_net
    volumes:
      - /srv/media:/srv
      - /srv/filebrowser/config:/config
      - /srv/filebrowser/database:/database
    command: [
      "--database", "/database/filebrowser.db",
      "--config", "/config/.filebrowser.json",
      "--root","/srv",
      "--address","0.0.0.0",
      "--baseurl","/filebrowser"
    ]
    restart: unless-stopped 
  ttyd:
    build: .
    container_name: ttyd
    restart: unless-stopped
    volumes:
      - ${TTYD_KEY}:/keys/id_ttyd:ro
    command: ttyd -W -b /${TTYD_PATH} -c ${USER}:${PASS} ssh -t -i /keys/id_ttyd -o StrictHostKeyChecking=no ${USER}@host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cloudflared_net


  # [Gemini 4 Argon | 2026-11-07 19:20] Added threadfin IPTV proxy & HDHomeRun tuner service
  threadfin:
    image: fyb3roptik/threadfin:1.2.37
    container_name: threadfin
    networks:
      - cloudflared_net
    ports:
      - "34400:34400"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /srv/threadfin/conf:/home/threadfin/conf
      - /srv/threadfin/temp:/tmp/threadfin
    restart: unless-stopped
